# Hyprland configuration overrides
# Add your custom settings here

# Example overrides:
# $mainMod = SUPER
$terminal = uwsm app -- ghostty
$browser = chromium --force-device-scale-factor=0.8

# Default editor for Hyprland-spawned children (e.g. the omarchy menu's
# "Edit monitors.conf"). omarchy-launch-editor reads $EDITOR; the omarchy menu
# is bound as a direct `exec`, so it inherits Hyprland's env rather than the
# shell's. ~/.zshrc keeps nvim as the terminal $EDITOR; this only affects the
# graphical session. (env lines apply at login, not on `hyprctl reload`.)
env = EDITOR,fresh
env = SUDO_EDITOR,fresh

# Per-machine monitor/scale. install-hyprland-overrides.sh symlinks
# ~/.config/hypr/monitors.local.conf -> hosts/<hostname>.conf (tracked in git),
# which defines $MONSCALE plus the monitor + GDK_SCALE lines.
source = ~/.config/hypr/monitors.local.conf

# trigger when the switch is turning on
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
# trigger when the switch is turning off
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, preferred, auto, $MONSCALE"

bind = SUPER SHIFT, D, exec, hyprctl keyword monitor eDP-1, disable
bind = SUPER SHIFT, F, exec, hyprctl keyword monitor eDP-1, preferred, auto, $MONSCALE

unbind = SUPER, D
bindd = SUPER, D, Discord, exec, omarchy-launch-webapp "https://discord.com/channels/@me"
unbind = SUPER, G
bindd = SUPER, G, Notion, exec, omarchy-launch-webapp "https://www.notion.so/"

# Remove default SUPER+ENTER terminal binding so we only use Ghostty
unbind = SUPER, RETURN
bindd = SUPER, RETURN, Terminal, exec, $terminal
unbind = SUPER, B
bindd = SUPER, B, Browser, exec, $browser

# Snappy Switcher (fast Alt+Tab window switcher). Installed via
# install-snappy-switcher.sh; user config.ini comes from the dotfiles repo.
# Overrides Omarchy defaults: ALT+TAB (cyclenext), SUPER+TAB (next workspace).
exec-once = snappy-switcher --daemon
unbind = ALT, TAB
unbind = SUPER, TAB
bindd = ALT, TAB, Snappy Switcher Next, exec, snappy-switcher next --mod alt
bindd = SUPER, TAB, Snappy Switcher Workspace Next, exec, snappy-switcher next --workspace --mod super

unbind = SUPER, h
unbind = SUPER, j
unbind = SUPER, J
unbind = SUPER, k
unbind = SUPER, K
unbind = SUPER, l

# Move focus with mainMod + arrow keys
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

# SUPER+K now moves focus up, so relocate the Omarchy keybindings cheat sheet
# (default SUPER+K) to SUPER+SHIFT+K.
bindd = SUPER SHIFT, K, Show key bindings, exec, omarchy-menu-keybindings

misc {
    mouse_move_enables_dpms=true
    key_press_enables_dpms=true
}

cursor {
    # Don't teleport the pointer onto a window when it's focused/activated.
    # Omarchy sets misc:focus_on_activate=true, so newly-opened windows (e.g.
    # an aerc terminal) grab focus and, with warping on, the cursor jumps to
    # them. This keeps the pointer where it is; focus-follows-mouse still works.
    no_warps = true
}

input {
  # Use multiple keyboard layouts and switch between them with Alt + Space
  # kb_layout = us,dk
  # kb_options = compose:caps,grp:alt_space_toggle
  kb_options = ctrl:nocaps


  # Change speed of keyboard repeat
  repeat_rate = 50
  repeat_delay = 220

  # Increase sensitity for mouse/trackpack (default: 0)
  # sensitivity = 0.35

  touchpad {
    # Use natural (inverse) scrolling
    # natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    # clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4
  }
}

# ── hyprland-scroll-overview (hyprpm plugin "scrolloverview", by yayuuu) ──────
# Workspace overview driven by touchpad scroll. Installed by
# install-hyprland-scroll-overview.sh. Managed by hyprpm, not pacman: after
# every Hyprland upgrade it must be rebuilt with `hyprpm update`, or it silently
# won't load and every bind below reports "Invalid dispatcher" in
# `hyprctl configerrors`. Config reference:
# github.com/yayuuu/hyprland-scroll-overview
#
# This block must stay LAST in this file -- see the submap caution below.

# Load built plugins into the compositor at login. hyprpm state persists across
# reboots but Hyprland does not auto-load plugins, so without this the overview
# is dead after every restart until `hyprpm reload` is run by hand.
exec-once = hyprpm reload -n

plugin {
    scrolloverview {
        layout        = vertical   # workspaces stack top-to-bottom
        scale         = 0.5        # size of each workspace thumbnail
        workspace_gap = 20         # separation between thumbnails (default 0)
        blur          = false      # set true for blurred backdrop (costs GPU)

        input {
            # Note: the touchpad already has scroll_factor = 0.4 set in the
            # input{} block above. This factor multiplies on top of that, so
            # raise it if the overview feels sluggish to scroll.
            touchpad_scroll_factor = 1.0
            scroll_event_delay     = 200
        }
    }
}

# SUPER+G is the plugin's documented example bind, but it's taken here (Notion,
# above), so the overview lives on SUPER+` instead.
#
# SUPER+grave is ALSO fcitx5's default "Quick Phrase" trigger, and fcitx5 grabs
# it at the input-method layer, so Hyprland never sees the conflict -- the
# overview opens and a Quick Phrase prompt pops up on the same press. It is
# unbound in the dotfiles repo (fcitx5/.config/fcitx5/conf/quickphrase.conf,
# installed by install-dotfiles.sh); if the prompt reappears, that stow symlink
# was likely clobbered by fcitx5-configtool.
bind = SUPER, grave, scrolloverview:overview, toggle

# The plugin has built-in keyboard nav, but it wasn't picking up arrow keys here.
# Defining this submap replaces that built-in handling with explicit binds; the
# plugin enters the submap automatically while the overview is open.
#
# CAUTION: everything between `submap = scrolloverview` and `submap = reset`
# belongs to the submap. The `submap = reset` line below is load-bearing --
# without it, every bind that follows would be swallowed into the submap and
# stop working globally. This file is sourced LAST from ~/.config/hypr/hyprland.conf,
# so keep this block at the end of the file and add new binds ABOVE it.
#
# While the overview is open, your normal binds are inactive unless they carry
# the `submap_universal` flag. Add that flag to any bind you want live in the
# overview.
submap = scrolloverview
    bind = , left,      scrolloverview:navigate, left
    bind = , right,     scrolloverview:navigate, right
    bind = , up,        scrolloverview:navigate, up
    bind = , down,      scrolloverview:navigate, down
    # Selecting is a three-step sequence: pick the workspace, pick the window
    # under the cursor/selection, then close the overview. `scrolloverview:overview
    # select` on its own only does the first step -- it switches workspace but never
    # focuses the window. Hyprlang can't chain dispatchers in one bind, so this goes
    # through `hyprctl --batch`. (The plugin's Lua API can express this directly.)
    bind = , return,    exec, hyprctl --batch "dispatch scrolloverview:overview select ; dispatch scrolloverview:window select ; dispatch scrolloverview:overview off"
    bind = , mouse:272, exec, hyprctl --batch "dispatch scrolloverview:overview select ; dispatch scrolloverview:window select ; dispatch scrolloverview:overview off"
    bind = , escape,    scrolloverview:overview, off
    bind = , mouse:274, scrolloverview:window,   close
submap = reset

# Jump straight to a workspace from inside the overview. These are global binds
# (deliberately after `submap = reset`) carrying `submap_universal`, which is what
# keeps them alive while the scrolloverview submap has the keyboard.
# ALT+1..9 was entirely free -- the only ALT binds here are media keys, PRINT and TAB.
# code:10..18 = number row 1..9, matching omarchy's layout-independent convention.
#
# NOTE: `submap_universal` is a bind FLAG, not a 5th argument. Written as a trailing
# argument (as the plugin README shows) it is silently parsed into the dispatcher's
# arg -- you get `workspace "1, submap_universal"` and a bind that fails at runtime
# while `hyprctl configerrors` stays clean. The flag letter is `u` -> `bindu`.
bindu = ALT, code:10, workspace, 1
bindu = ALT, code:11, workspace, 2
bindu = ALT, code:12, workspace, 3
bindu = ALT, code:13, workspace, 4
bindu = ALT, code:14, workspace, 5
bindu = ALT, code:15, workspace, 6
bindu = ALT, code:16, workspace, 7
bindu = ALT, code:17, workspace, 8
bindu = ALT, code:18, workspace, 9
