# Hyprland configuration overrides
# Add your custom settings here

# Example overrides:
# $mainMod = SUPER
$terminal = uwsm app -- ghostty
$browser = chromium --force-device-scale-factor=0.8

# Single default monitor + scale (see all monitors with: hyprctl monitors).
# This file is sourced LAST in hyprland.conf, so it overrides
# ~/.config/hypr/monitors.conf. Keep monitor/scale config HERE so it is
# tracked in git and persists across machines and rebuilds.
# 3840x2400 panel @ scale 1.5 -> effective 2560x1600.
monitor=,preferred,auto,1.5

# Let Wayland fractional scaling drive GTK apps; don't force an integer GDK scale
env = GDK_SCALE,1

# trigger when the switch is turning on
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
# trigger when the switch is turning off
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, preferred, auto, 1.5"

bind = SUPER SHIFT, D, exec, hyprctl keyword monitor eDP-1, disable
bind = SUPER SHIFT, F, exec, hyprctl keyword monitor eDP-1, preferred, auto, 1.5

unbind = SUPER, D
bindd = SUPER, D, Discord, exec, omarchy-launch-webapp "https://discord.com/channels/@me"
unbind = SUPER, G
bindd = SUPER, G, Notion, exec, omarchy-launch-webapp "https://www.notion.so/"

# Remove default SUPER+ENTER terminal binding so we only use Ghostty
unbind = SUPER, RETURN
bindd = SUPER, RETURN, Terminal, exec, $terminal
unbind = SUPER, B
bindd = SUPER, B, Browser, exec, $browser

unbind = SUPER, h
unbind = SUPER, j
unbind = SUPER, J
unbind = SUPER, k
unbind = SUPER, K
unbind = SUPER, l

# Move focus with mainMod + arrow keys
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

misc {
    mouse_move_enables_dpms=true
    key_press_enables_dpms=true
}

input {
  # Use multiple keyboard layouts and switch between them with Alt + Space
  # kb_layout = us,dk
  # kb_options = compose:caps,grp:alt_space_toggle
  kb_options = ctrl:nocaps


  # Change speed of keyboard repeat
  repeat_rate = 50
  repeat_delay = 220

  # Increase sensitity for mouse/trackpack (default: 0)
  # sensitivity = 0.35

  touchpad {
    # Use natural (inverse) scrolling
    # natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    # clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4
  }
}
