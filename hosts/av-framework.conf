# Monitor + scale for av-framework. See hosts/default.conf for the scale guide.
# Framework 13 AMD: 13.5" 2880x1920 eDP-1. 1.5 divides evenly (-> 1920x1280
# effective); Omarchy's stock scale 2 (1440x960) is too zoomed in on this panel.
# Keep in sync with hypr/lua/hosts/av-framework.lua.
# GDK_SCALE stays at 1 so Wayland fractional scaling drives GTK apps.
$MONSCALE = 1.5
env = GDK_SCALE,1
monitor = ,preferred,auto,$MONSCALE
