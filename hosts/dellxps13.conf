# Per-machine monitor + scale for host: dellxps13
# Tracked in git. install-hyprland-overrides.sh symlinks this to
# ~/.config/hypr/monitors.local.conf, which hyprland-overrides.conf sources.
# 3840x2400 panel @ 1.5 -> effective 2560x1600.
$MONSCALE = 1.5
env = GDK_SCALE,1
monitor = ,preferred,auto,$MONSCALE

# --- Machine note: suspend/resume fix (2026-06-28) ---
# Symptom: closing the lid -> wake = black screen, requiring a hard power-off.
# Cause: XPS 9320 is modern-standby only (s2idle, no S3 deep sleep); Intel i915
#   intermittently fails to re-arm the panel on resume out of s2idle.
# Fix (lives OUTSIDE this repo, in the system bootloader config):
#   Added `i915.enable_psr=0` to KERNEL_CMDLINE in /etc/default/limine,
#   then `sudo limine-update` and reboot. Verify with `cat /proc/cmdline`.
# If it still black-screens: also add `i915.enable_fbc=0` (same file/steps),
#   and update the Dell BIOS (was 2.17.0 / 2024-11-11) to the latest release.
