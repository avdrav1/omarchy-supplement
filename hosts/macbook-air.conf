# Fallback per-machine monitor + scale.
# Used when hosts/<hostname>.conf does not exist yet. On a new machine,
# install-hyprland-overrides.sh copies this to hosts/<hostname>.conf; set
# MONSCALE there and commit it so the machine is tracked in git.
#   HiDPI laptop panel (e.g. 3840x2400 13") -> 1.5 or 2
#   1080p / 1440p / ultrawide               -> 1
# GDK_SCALE stays at 1 so Wayland fractional scaling drives GTK apps.
$MONSCALE = 1
env = GDK_SCALE,1
monitor = ,preferred,auto,$MONSCALE
